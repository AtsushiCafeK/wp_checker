[project]
name = "wp-checker"
version = "0.1.0"
description = "WordPress コンテンツ層の脆弱性スキャナ（自己管理サイト向け）"
authors = [{ name = "Atsushi Shindo", email = "atsushi.shindo@it-libero.jp" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
wp-checker = "wp_checker.cli:main"

[tool.poetry]
packages = [{ include = "wp_checker" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
